name: CI - KampusLMS

on:
  push:
    branches: [ main, master, 'feature/**', 'w**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: kampuslms_kelompok_02
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Copy and Configure .env for CI
        # Menyalin blueprint .env.example menjadi .env pada runner CI
        # lalu secara dinamis mengisi kredensial database runner CI (DB_PASSWORD=password)
        # sehingga repositori tetap aman tanpa mengekspos data pribadi/rahasia di .env.example.
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations & Seeders
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kampuslms_kelompok_02
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate:fresh --seed --force

      - name: Execute Tests (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kampuslms_kelompok_02
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

      - name: Start Server & Test Authorization Script
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kampuslms_kelompok_02
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan serve --port=8000 &
          sleep 3
          chmod +x scripts/test-authz.sh
          ./scripts/test-authz.sh
